<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SEE Bridge</title>
<meta name="theme-color" content="#f2f2f7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SEE Bridge">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="hub-manifest.json?v=2">
<link rel="apple-touch-icon" href="images/hub-icon-180.png?v=2">
<link rel="icon" type="image/png" href="images/hub-icon-192.png?v=2">
<style>
:root{--c-main:#7B3FE4;--bg:#f2f2f7;--card:#fff;--ink:#1c1c1e;--sub:#5f5f66;--faint:#8e8e93;--line:#ececf0;--blue:#0a5bd3;--red:#d93025;--green:#15803d;
  --c-pto:var(--c-main);--c-hiring:var(--c-main);--c-enroll:var(--c-main);--c-careplan:var(--c-main);--c-vacation:var(--c-main);--c-overtime:var(--c-main);--c-term:#55555c;--c-termcare:#55555c;--c-onboard:var(--c-main)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
a{color:var(--blue);text-decoration:none}
.hidden{display:none!important}
#wrap{max-width:620px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 28px) 20px calc(env(safe-area-inset-bottom) + 96px)}
#wrap.wide{max-width:none;padding:0 0 calc(env(safe-area-inset-bottom) + 84px)}
.eyebrow{font-size:13px;font-weight:600;color:var(--sub);letter-spacing:.02em;text-transform:uppercase}
h1{margin:2px 0 0;font-size:32px;font-weight:700;letter-spacing:-.02em}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.round{position:relative;width:44px;height:44px;border-radius:22px;border:0;background:var(--card);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.badge{position:absolute;top:2px;right:2px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
.seg{display:flex;background:#e3e3e8;border-radius:10px;padding:2px;margin-top:16px}
.seg button{flex:1;height:32px;border:0;border-radius:8px;background:transparent;font-size:13px;font-weight:500;color:#3a3a3f;cursor:pointer}
.seg button[aria-pressed=true]{background:#fff;font-weight:600;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.wait{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:#e5261b;color:#fff;border:0;border-radius:18px;padding:16px 18px;margin-top:16px;cursor:pointer}
.wait.calm{background:var(--card);color:var(--ink);cursor:default}
.wait .k{font-size:13px;color:#fff;font-weight:500}
.wait.calm .k{color:var(--sub)}
.wait .b{font-size:20px;font-weight:700;margin-top:4px}
.wait .s{font-size:13px;color:#fff;margin-top:4px}
.cks{display:flex;flex-direction:column;gap:2px;margin-top:10px;border-top:1px solid var(--line);padding-top:8px}
.ck{display:flex;align-items:flex-start;gap:10px;width:100%;border:0;background:none;text-align:left;padding:7px 0;cursor:pointer;min-height:40px}
.ck:disabled{cursor:default;opacity:.6}
.ck .bx{width:22px;height:22px;border-radius:7px;border:2px solid #b8b8bf;flex-shrink:0;display:flex;align-items:center;justify-content:center;margin-top:1px}
.ck.on .bx{background:#1f9d47;border-color:#1f9d47}
.ck .bx svg{width:14px;height:14px}
.ck .cl{font-size:14px;color:var(--ink);display:flex;flex-direction:column}
.ck.on .cl{color:var(--sub)}
.ck .cl small{font-size:12px;color:var(--sub);margin-top:1px}
.ckg{margin:4px 0}
.ckh{display:flex;justify-content:space-between;font-size:13px;font-weight:700;color:var(--ink);padding:6px 0 2px}
.ckh span{font-weight:500;color:var(--sub)}
.ckg .ck{padding-left:12px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:12px}
@media (min-width:560px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.sec{margin:26px 4px 0;font-size:20px;font-weight:700;letter-spacing:-.01em}
.tile{background:var(--card);border:0;border-radius:18px;padding:14px;display:flex;flex-direction:column;justify-content:space-between;gap:10px;min-height:128px;text-align:left;cursor:pointer}
.tile .row{display:flex;justify-content:space-between;align-items:flex-start}
.ico{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ico svg{width:20px;height:20px}
.round svg,.wait svg,.quick svg{width:22px;height:22px;flex-shrink:0}
.back svg{width:22px;height:22px}
.ico.sm{width:34px;height:34px;border-radius:9px}
.ico.sm svg{width:18px;height:18px}
.cnt{min-width:24px;height:24px;padding:0 7px;border-radius:12px;background:var(--red);color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center}
.tile .n{font-size:16px;font-weight:600}
.tile .l{font-size:12px;color:var(--sub);margin-top:2px}
.quick{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.quick button{flex:1;min-width:150px;display:flex;align-items:center;gap:10px;background:var(--card);border:0;border-radius:14px;padding:12px 14px;font-size:15px;font-weight:500;cursor:pointer;text-align:left;min-height:48px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.chips button{height:32px;padding:0 14px;border:0;border-radius:16px;background:var(--card);font-size:13px;font-weight:500;cursor:pointer}
.chips button[aria-pressed=true]{background:var(--ink);color:#fff;font-weight:600}
.grp{font-size:13px;font-weight:600;color:var(--sub);text-transform:uppercase;letter-spacing:.02em;padding:18px 4px 8px}
.card{background:var(--card);border-radius:16px;overflow:hidden}
.item{display:flex;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.item:last-child{border-bottom:0}
.item .mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.item .t{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.item .tt{font-size:15px;font-weight:500;overflow-wrap:anywhere}
.item.new .tt{font-weight:600}
.item .tm{font-size:12px;color:var(--sub);flex-shrink:0}
.item .sb{font-size:13px;color:#3a3a3f;overflow-wrap:anywhere}
.item .nt{font-size:13px;color:var(--sub);font-style:italic;overflow-wrap:anywhere}
.item .acts{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.pill{height:32px;padding:0 14px;border-radius:16px;border:0;background:#ececf0;color:var(--ink);font-size:13px;font-weight:600;display:inline-flex;align-items:center;cursor:pointer}
.pill.go{background:var(--blue);color:#fff}
.pill.no{background:#fde8e7;color:#b3261e}
.tag{display:inline-block;font-size:12px;font-weight:600;border-radius:6px;padding:2px 7px;margin-right:6px;background:#ececf0;color:#3a3a3f}
.tag.ok{background:#e3f4e8;color:#14692f}
.tag.bad{background:#fde8e7;color:#b3261e}
.tag.need{background:#fff1d6;color:#8a4b00}
.dot{width:9px;height:9px;border-radius:5px;background:var(--blue);flex-shrink:0;margin-top:6px}
.empty{background:var(--card);border-radius:16px;padding:28px 18px;text-align:center;color:var(--sub);font-size:15px;margin-top:14px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:6px}
.link{border:0;background:none;color:var(--blue);font-size:15px;font-weight:500;cursor:pointer;padding:8px 4px;min-height:40px}
.back{display:inline-flex;align-items:center;gap:4px;border:0;background:none;color:var(--blue);font-size:17px;cursor:pointer;padding:6px 0;min-height:44px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 92px);background:var(--ink);color:#fff;border-radius:14px;padding:12px 16px;font-size:14px;max-width:calc(100% - 32px);z-index:50;box-shadow:0 6px 20px rgba(0,0,0,.2)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-around;background:rgba(255,255,255,.94);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:1px solid #d8d8dd;padding:6px 0 calc(env(safe-area-inset-bottom) + 6px);z-index:40}
nav button{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;color:var(--sub);font-size:11px;font-weight:500;min-width:72px;min-height:48px;cursor:pointer}
nav button[aria-current=page]{color:var(--blue);font-weight:600}
nav svg{width:24px;height:24px}
nav .badge{top:-2px;right:14px}
.set{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line)}
.set:last-child{border-bottom:0}
.set .grow{flex:1;min-width:0}
.set .sm{font-size:13px;color:var(--sub);margin-top:2px}
.sw{position:relative;width:51px;height:31px;flex-shrink:0}
.sw input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;z-index:1}
.sw span{position:absolute;inset:0;border-radius:16px;background:#d4d4d9;transition:background .2s}
.sw span::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:14px;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:transform .2s}
.sw input:checked+span{background:#1f9d47}
.sw input:checked+span::after{transform:translateX(20px)}
.sw input:focus-visible+span{outline:2px solid var(--blue);outline-offset:2px}
.mark{width:10px;height:10px;border-radius:3px;flex-shrink:0}
.btn{min-height:44px;padding:0 18px;border:0;border-radius:12px;background:var(--blue);color:#fff;font-size:16px;font-weight:600;cursor:pointer}
.btn.soft{background:#ececf0;color:var(--ink)}
.btn:disabled{opacity:.55}
.help{font-size:14px;color:var(--sub);line-height:1.45;margin:8px 4px 0}
.login{max-width:380px;margin:8vh auto 0;text-align:center}
.login img{height:56px;width:auto;margin-bottom:18px}
.login form{background:var(--card);border-radius:20px;padding:22px;margin-top:22px;text-align:left;display:flex;flex-direction:column;gap:14px}
.login label{font-size:14px;font-weight:600;display:flex;flex-direction:column;gap:6px}
.login input{min-height:46px;border:1px solid #d2d2d7;border-radius:12px;padding:0 14px;font-size:17px;background:#fff}
.err{color:#b3261e;font-size:14px;min-height:1em}
.embed-top{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:12px;background:rgba(242,242,247,.94);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);padding:calc(env(safe-area-inset-top) + 4px) 16px 4px;border-bottom:1px solid #e0e0e5}
.embed-top b{font-size:17px}
.ask{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:16px;padding:14px;margin-top:12px}
.ask .grow{flex:1;min-width:0;font-size:14px;color:var(--sub)}
.ask .grow b{display:block;font-size:15px;color:var(--ink)}
.seg button[data-center][aria-pressed=true]{color:#fff;font-weight:600}
.seg button[data-center=SF][aria-pressed=true]{background:#0B6BEB}
.seg button[data-center=all][aria-pressed=true]{background:#7B3FE4}
.seg button[data-center=BV][aria-pressed=true]{background:#40B549}
.sect{display:flex;align-items:center;gap:10px;width:100%;margin-top:18px;padding:14px 16px;border:0;border-radius:14px;background:var(--card);color:var(--ink);font:inherit;font-size:16px;font-weight:600;text-align:left;cursor:pointer}
.mini{display:flex;align-items:center;gap:12px;width:100%;padding:11px 14px;border:0;border-bottom:1px solid var(--line);background:none;font:inherit;color:var(--ink);text-align:left;cursor:pointer}
.mini:last-child{border-bottom:0}
.mini .okb{width:24px;height:24px;border-radius:50%;background:#1f9d47;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.mini .okb svg{width:14px;height:14px}
.mini .mn{flex:1;min-width:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .md{font-size:13px;color:var(--sub);white-space:nowrap}
.mini>svg{width:16px;height:16px;color:var(--faint);flex-shrink:0}
.minic{display:block;margin:-4px 0 8px 64px;background:none;border:0;color:var(--blue);font:inherit;font-size:14px;cursor:pointer}
.sect .grow{flex:1;min-width:0}
.sect b{display:inline-block;min-width:22px;margin-left:6px;padding:1px 7px;border-radius:999px;background:#ececf0;font-size:13px;text-align:center}
.sect small{display:block;font-size:13px;font-weight:400;color:var(--sub);margin-top:2px}
.sect svg{width:18px;height:18px;color:var(--faint);transition:transform .2s;flex-shrink:0}
.sect[aria-expanded=true] svg{transform:rotate(90deg)}
.arq{width:100%;min-height:42px;margin-top:10px;border:1px solid #d2d2d7;border-radius:12px;padding:0 12px;font:inherit;font-size:16px;background:#fff}
.uform{display:flex;flex-direction:column;gap:12px;padding:16px}
.uform label{font-size:14px;font-weight:600;display:flex;flex-direction:column;gap:6px}
.uform input{min-height:44px;border:1px solid #d2d2d7;border-radius:12px;padding:0 12px;font-size:16px;background:#fff;font-family:inherit}
.urow{width:100%;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;font:inherit;color:inherit;cursor:pointer}
.urow:last-child{border-bottom:0}
.urow svg{width:18px;height:18px;color:var(--faint);flex-shrink:0}
.top .pill{white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
.top .pill svg{width:16px;height:16px}
.ubtns{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.note{background:#fff8e6;color:#5c4400;border-radius:14px;padding:12px 14px;font-size:14px;line-height:1.45;margin:4px 0 14px}
.login .link{background:none;border:0;color:var(--blue);font:inherit;font-size:15px;cursor:pointer;padding:6px}
.spin{display:inline-block;width:18px;height:18px;border:2px solid #c7c7cc;border-top-color:var(--blue);border-radius:50%;animation:sp 1s linear infinite;vertical-align:-4px}
@keyframes sp{to{transform:rotate(360deg)}}
.ot-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:22px 4px 8px}
.ot-head h2{margin:0;font-size:20px;font-weight:700;letter-spacing:-.01em}
.ot-head span{font-size:13px;color:var(--sub);font-weight:600}
.ot-row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line)}
.ot-row:last-child,.mini:last-child{border-bottom:0}
.ot-row .grow{min-width:0}
.ot-row .nm{font-weight:600;font-size:16px}
.ot-row .dt{font-size:13px;color:var(--sub);margin-top:2px}
.ot-num{text-align:right;flex-shrink:0}
.ot-num b{display:block;font-size:17px;font-variant-numeric:tabular-nums}
.ot-num small{display:block;font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums}
.ot-num b .ot-red{color:#b3261e}
.ot-over{display:inline-block;font-size:12px;font-weight:700;border-radius:6px;padding:1px 6px;background:#fde8e7;color:#b3261e;margin-left:6px;vertical-align:1px}
.ot-rank{width:24px;height:24px;border-radius:12px;background:var(--c-main);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ot-clear{display:flex;align-items:center;gap:12px;padding:16px 14px}
.ot-clear .okb{width:28px;height:28px;border-radius:14px;background:#34c759;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ot-clear .okb svg{width:16px;height:16px}
.ot-warn{background:#fff1d6;color:#8a4b00;border-radius:14px;padding:12px 14px;font-size:14px;line-height:1.4;margin-top:12px}
.ot-line{padding:12px 14px;font-size:14px;color:var(--sub);line-height:1.45}
.ot-line b{color:var(--ink);font-weight:600}
.ot-total{background:var(--card);border-radius:16px;padding:16px 18px;margin-top:12px;display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.ot-total .k{font-size:13px;font-weight:600;color:var(--sub);text-transform:uppercase;letter-spacing:.02em}
.ot-total b{font-size:28px;font-weight:700;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.ot-total b small{font-size:15px;font-weight:600;color:var(--sub);margin-left:4px}
.ot-tw{background:var(--card);border-radius:16px;overflow-x:auto;-webkit-overflow-scrolling:touch;margin-top:12px}
.ot-t{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
.ot-t th{font-size:10px;font-weight:600;color:var(--sub);text-transform:uppercase;letter-spacing:0;padding:10px 3px 8px;text-align:center;white-space:nowrap}
.ot-t td{padding:10px 3px;border-top:1px solid var(--line);text-align:center;white-space:nowrap}
@media (min-width:560px){.ot-t th{font-size:11px;padding:10px 8px 8px}.ot-t td{padding:11px 8px}}
.ot-t th:first-child,.ot-t td:first-child{text-align:left;padding-left:14px;position:sticky;left:0;background:var(--card);white-space:normal;min-width:64px;max-width:96px;line-height:1.2}
.ot-t td:first-child{font-weight:600;font-size:14px}
.ot-t th:last-child,.ot-t td:last-child{padding-right:12px}
.ot-t td.d b{font-weight:700;color:var(--ink)}
.ot-t td.d i{color:var(--sub)}
.ot-t td.d .no{color:var(--faint)}
.ot-t td.pj{font-weight:700;font-size:14px;border-left:1px solid var(--line)}
.ot-t tr.hot td:first-child{box-shadow:inset 3px 0 0 #d93025}
.ot-key{display:flex;gap:16px;font-size:13px;color:var(--sub);margin:10px 4px 0}
.ot-key b{color:var(--ink)}
.ot-row.has-days{display:grid;grid-template-columns:24px minmax(0,1fr) auto;column-gap:12px;align-items:start}
.ot-row.has-days .ot-rank{margin-top:1px}
.ot-row.has-days .ot-days{grid-column:2 / 3}
.ot-row.has-days .ot-ovm{grid-column:3;justify-self:end;align-self:center;margin-top:8px;font-size:13px;font-weight:400;color:#b3261e;white-space:nowrap;font-variant-numeric:tabular-nums}
.ot-row.has-days .dt{grid-column:2 / 4;margin-top:4px}
.ot-days{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px;margin-top:8px;max-width:420px}
.ot-dy{text-align:center;border-radius:7px;padding:2px 0 3px;background:#f4f4f7}
.ot-dy .k{font-size:9.5px;font-weight:600;color:var(--sub);text-transform:uppercase;letter-spacing:.02em}
.ot-dy .v{font-size:13px;line-height:1.35;font-variant-numeric:tabular-nums;white-space:nowrap}
.ot-dy .v b{font-weight:700;color:var(--ink)}
.ot-dy .v i{color:var(--sub)}
.ot-dy .v .no{color:var(--faint)}
.ot-dy.x{background:#fde8e7;box-shadow:inset 0 0 0 1.5px #e9a29b}
.ot-dy.x .k{color:#b3261e}
#wrap.sc-wide{max-width:1240px}
.sc-bar{display:flex;align-items:center;gap:8px;margin-top:14px;flex-wrap:wrap}
.sc-bar .round svg{width:20px;height:20px}
.pill:disabled{opacity:.55;cursor:default}
.sc-wrap{background:var(--card);border-radius:16px;overflow-x:auto;-webkit-overflow-scrolling:touch;margin-top:12px}
.sc-t{border-collapse:collapse;width:100%;min-width:860px;font-size:13px}
.sc-t thead th{font-size:12px;font-weight:600;color:var(--sub);padding:10px 6px 8px;text-align:left;white-space:nowrap}
.sc-t tbody th{position:sticky;left:0;z-index:1;background:var(--card);text-align:left;padding:8px 10px 8px 14px;min-width:150px;max-width:170px;border-top:1px solid var(--line);vertical-align:top}
.sc-t thead th:first-child,.sc-t tfoot th{position:sticky;left:0;background:var(--card);z-index:1}
.sc-nm{display:block;font-size:14px;font-weight:600}
.sc-t tbody th small{display:block;font-size:12px;font-weight:400;color:var(--sub);margin-top:2px}
.sc-hp{display:flex;gap:6px;align-items:baseline;flex-wrap:wrap;margin-top:3px;font-size:13px;font-variant-numeric:tabular-nums}
.sc-hp b{font-weight:600}
.sc-hp em{font-style:normal;font-weight:700;color:#b3261e;font-size:12px}
.sc-cl{display:block;padding:8px 6px;font-size:12px;font-weight:600;color:#b3261e}
.sc-foot th small{display:block;font-weight:500}
.sc-cell{border-top:1px solid var(--line);border-left:1px solid var(--line);padding:3px;vertical-align:top;min-width:128px}
.sc-cell.sc-closed{background:repeating-linear-gradient(135deg,#f6f6f8 0 6px,#ededf1 6px 12px)}
.sc-cell.sc-chg .sc-hit{outline:2px dashed #c27c0e;outline-offset:-2px}
.sc-hit{display:flex;flex-direction:column;gap:3px;width:100%;min-height:52px;border:0;background:none;border-radius:8px;padding:2px;text-align:left;cursor:pointer;font:inherit;color:inherit}
.sc-hit:hover{background:#f6f6f9}
.sc-plus{margin:auto;color:#c7c7cc;font-size:20px}
.sc-chip{display:flex;flex-direction:column;border-radius:6px;padding:3px 6px;line-height:1.25}
.sc-chip b{font-size:12px;font-weight:600;white-space:nowrap}
.sc-chip span{font-size:11px;color:#3a3a3f;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc-chip.sc-other{background:#f2f2f5;border-left:3px solid #40B549}
.sc-tot{border-top:1px solid var(--line);padding:8px 14px 8px 6px;white-space:nowrap;vertical-align:top;font-variant-numeric:tabular-nums}
.sc-tot b{display:block;font-size:14px}
.sc-ot{display:block;color:#b3261e;font-weight:700;font-size:12px}
.sc-open th,.sc-open td{background:#fffbeb}
.sc-foot th,.sc-foot td{border-top:1px solid #d8d8dd;padding:8px 6px;font-size:12px;color:var(--sub);font-weight:600;font-variant-numeric:tabular-nums}
.sc-foot th{padding-left:14px;text-align:left}
.sc-day{border:0;background:none;font:inherit;font-weight:600;color:var(--sub);cursor:pointer;padding:4px;border-radius:6px;text-align:left}
.sc-day small{display:block;font-size:11px;color:#b3261e}
.sc-key{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--sub);margin:10px 4px 0}
.sc-key i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.sc-sheet{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.32);display:flex;align-items:flex-end;justify-content:center}
@media (min-width:640px){.sc-sheet{align-items:center}}
.sc-card{background:var(--card);width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:18px 18px calc(env(safe-area-inset-bottom) + 18px);max-height:90vh;overflow:auto}
@media (min-width:640px){.sc-card{border-radius:20px}}
.sc-ch{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px}
.sc-ch b{font-size:18px}
.sc-ch .sm{font-size:13px;color:var(--sub);margin-top:2px}
.sc-blk{display:grid;grid-template-columns:1fr auto 1fr;gap:6px 8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.sc-blk select{grid-column:1 / 3}
.sc-blk input,.sc-blk select{min-height:42px;border:1px solid #d2d2d7;border-radius:10px;padding:0 10px;font:inherit;font-size:16px;background:#fff;width:100%}
.sc-blk span{font-size:13px;color:var(--sub)}
.sc-x{width:42px;height:42px;border:0;border-radius:10px;background:#fde8e7;color:#b3261e;font-size:22px;cursor:pointer;justify-self:end}
.sc-acts{display:flex;gap:8px;margin:12px 0}
.sc-rep{display:flex;align-items:center;gap:8px;font-size:14px;margin:4px 0 8px}
.sc-rep input{width:20px;height:20px}
</style>

<body>
<div id="wrap"><div id="view"></div><div id="embed-hiring" class="hidden"></div><div id="embed-pto" class="hidden"></div><div id="embed-onboard" class="hidden"></div></div>
<nav id="nav" class="hidden" aria-label="SEE Bridge">
  <button type="button" data-tab="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3 10 9-7 9 7v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/><path d="M9 22V12h6v10"/></svg>Home</button>
  <button type="button" data-tab="inbox"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.5 5.1 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.5-6.9A2 2 0 0 0 16.8 4H7.2a2 2 0 0 0-1.7 1.1Z"/></svg>Inbox<span id="nav-badge" class="badge hidden"></span></button>
  <button type="button" data-tab="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 1v3M12 20v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M1 12h3M20 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>Settings</button>
</nav>
<script>
(function(){
var API = window.SEE_FORM_ENDPOINT || 'https://www.see.school/_functions/seeForm';
var KEY = 'seeHub';
var ICON = {
  pto:'<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
  hiring:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6M22 11h-6"/>',
  enroll:'<path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.7-.9L9.6 3.9A2 2 0 0 0 7.9 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/>',
  careplan:'<rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M12 11v6M9 14h6"/>',
  vacation:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  onboard:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="m16 11 2 2 4-4"/>',
  term:'<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5M21 12H9"/>',
  overtime:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  termcare:'<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5M21 12H9"/>',
  bell:'<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>',
  check:'<path d="M20 6 9 17l-5-5"/>', chev:'<path d="m9 18 6-6-6-6"/>', back:'<path d="m15 18-6-6 6-6"/>', plus:'<path d="M12 5v14M5 12h14"/>', refresh:'<path d="M21 12a9 9 0 1 1-2.6-6.4L21 8"/><path d="M21 3v5h-5"/>'
};
var KIND = {
  pto:{name:'PTO'}, hiring:{name:'Hiring'}, onboard:{name:'On Board'}, enroll:{name:'Enrollment'}, careplan:{name:'Care Plans'}, vacation:{name:'Family Vacations'}, overtime:{name:'Overtime'}, term:{name:'Terminations',full:'Termination of Employment'}, termcare:{name:'Terminations',full:'Termination of Care'}
};
var FILTERS = [['all','All'],['needs','Needs me'],['team','Team members'],['families','Families']];
var GROUPS = { team:['pto','hiring','onboard','term','overtime'], families:['enroll','careplan','vacation','termcare'] };
var PREF_TEAM = [['pto','PTO requests','pto'],['pto_ok','PTO approved (heads-up)','pto'],['hiring_new','New applicants','hiring'],['hiring_iv','Interviews & offers','hiring'],['onboard','Team member on board','onboard'],['term','Termination of employment','term'],['overtime','Overtime (nightly report)','overtime']];
var PREF_FAM = [['enroll','Enrollment packets','enroll'],['careplan','Care plans','careplan'],['vacation','Family vacations','vacation'],['termcare','Termination of care','termcare']];

var S = { mini:{}, sect:{}, arq:'', view:'home', filter:'all', center:'all', list:null, data:null, prefs:null, busy:false, open:{} };
var me = load();

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function svg(name, color){ return '<svg viewBox="0 0 24 24" fill="none" stroke="'+(color||'currentColor')+'" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+ICON[name]+'</svg>'; }
function ico(kind, sm){ return '<span class="ico'+(sm?' sm':'')+'" style="background:var(--c-'+kind+')">'+svg(kind,'#fff')+'</span>'; }
function load(){ try{ return JSON.parse(localStorage.getItem(KEY)||'null'); }catch(e){ return null; } }
function save(v){ me=v; try{ if(v) localStorage.setItem(KEY,JSON.stringify(v)); else localStorage.removeItem(KEY); }catch(e){} }
function post(o){
  o.form='hub'; if(me){ if(me.session) o.session=me.session; else { o.pass=me.pass; o.name=me.name; } }
  return fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(o)})
    .then(function(r){ return r.json(); })
    .catch(function(){ return { ok:false, error:'Can’t reach SEE right now. Check your connection and try again.' }; });
}
var toastT;
function toast(msg){ var t=$('toast'); if(!t){ t=document.createElement('div'); t.id='toast'; t.className='toast'; t.setAttribute('role','status'); document.body.appendChild(t); } t.textContent=msg; t.classList.remove('hidden'); clearTimeout(toastT); toastT=setTimeout(function(){ t.classList.add('hidden'); },4200); }

// ---------- data ----------
function feed(){ var f=(S.data&&S.data.feed)||[]; if(S.center==='all') return f; return f.filter(function(x){ return !x.center || x.center===S.center; }); }
function inFilter(x,f){ if(f==='all') return true; if(f==='needs') return x.needs; if(GROUPS[f]) return GROUPS[f].indexOf(x.kind)>=0; return x.kind===f; }
function apply(r){
  if(r && r.locked){ var wp=me&&!me.session; save(null); S.data=null; S.users=null; showLogin(r.error,'',wp?'pass':''); return false; }
  if(!r || !r.ok){ toast((r&&r.error)||'Something went wrong.'); return false; }
  (r.feed||[]).forEach(function(x){ if(x.kind==='term' && x.id.indexOf('toc:')===0) x.kind='termcare'; });
  S.data=r; S.prefs=r.prefs;
  var n=(r.feed||[]).filter(function(x){ return x.unread||x.needs; }).length;
  var b=$('nav-badge'); b.textContent=n>99?'99+':n; b.classList.toggle('hidden',!n);
  try{ if(navigator.setAppBadge){ if(n) navigator.setAppBadge(n); else navigator.clearAppBadge(); } }catch(e){}
  return true;
}
function refresh(quiet){
  if(!me || S.busy) return Promise.resolve();
  S.busy=true;
  return post({action:'feed'}).then(function(r){ S.busy=false; if(apply(r) && (!quiet || ['home','inbox','list'].indexOf(S.view)>=0) && !(quiet && document.activeElement && document.activeElement.id==='ar-q')) render(); });
}
function markRead(ids){
  ids=ids.filter(function(id){ var x=(S.data.feed||[]).find(function(y){ return y.id===id; }); if(x&&x.unread){ x.unread=false; return true; } return false; });
  if(!ids.length) return;
  apply(S.data); post({action:'read',ids:ids}).then(function(r){ if(r&&r.ok) apply(r); });
}

// ---------- time labels ----------
function dayKey(d){ return d.getFullYear()+'-'+d.getMonth()+'-'+d.getDate(); }
function when(at){
  var d=new Date(at), now=new Date();
  if(dayKey(d)===dayKey(now)) return d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
  var y=new Date(now); y.setDate(y.getDate()-1);
  if(dayKey(d)===dayKey(y)) return 'Yesterday';
  if(now-d<6*864e5) return d.toLocaleDateString('en-US',{weekday:'short'});
  return d.toLocaleDateString('en-US',{month:'short',day:'numeric'});
}
function group(at){
  var d=new Date(at), now=new Date(), y=new Date(now); y.setDate(y.getDate()-1);
  if(dayKey(d)===dayKey(now)) return 'Today';
  if(dayKey(d)===dayKey(y)) return 'Yesterday';
  if(now-d<7*864e5) return 'This week';
  return 'Earlier';
}

// ---------- views ----------
function setView(v, arg){
  S.view=v; if(v==='list') S.list=arg;
  var emb = v==='hiring'||v==='ptoadmin'||v==='onboardform';
  $('wrap').classList.toggle('wide', emb);
  $('wrap').classList.toggle('sc-wide', v==='sched');
  $('embed-hiring').classList.toggle('hidden', v!=='hiring');
  $('embed-pto').classList.toggle('hidden', v!=='ptoadmin');
  $('embed-onboard').classList.toggle('hidden', v!=='onboardform');
  $('view').classList.toggle('hidden', emb);
  var tab = v==='list'||v==='overtime'||v==='sched'||emb ? 'home' : (v==='users'||v==='useredit'||v==='password') ? 'settings' : v;
  Array.prototype.forEach.call(document.querySelectorAll('nav button'),function(b){ if(b.getAttribute('data-tab')===tab) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current'); });
  if(v==='hiring') openEmbed('hiring'); else if(v==='ptoadmin') openEmbed('pto'); else if(v==='onboardform') openEmbed('onboard'); else render();
  if(v==='sched' && (!S.sc || !S.sc.data) && !(S.sc && S.sc.busy)) scLoad();
  window.scrollTo(0,0);
}
// Icon color follows the center you're looking at: both centers purple, Sioux Falls blue, Brandon green.
var CENTER_COLOR={all:'#7B3FE4',SF:'#0B6BEB',BV:'#40B549'};
function paintCenter(){ var c=!S.data?'all':(S.data.role==='ALL'?(S.view==='list'&&S.list==='onboard'?obCenter():S.center):S.data.role); document.documentElement.style.setProperty('--c-main', CENTER_COLOR[c]||CENTER_COLOR.all); }
function render(){
  var v=$('view'); paintCenter();
  if(!S.data){ v.innerHTML='<div class="empty"><span class="spin"></span> Loading…</div>'; return; }
  if(S.view==='home') v.innerHTML=home();
  else if(S.view==='inbox') v.innerHTML=inbox();
  else if(S.view==='list') v.innerHTML=listView(S.list);
  else if(S.view==='settings') v.innerHTML=settings();
  else if(S.view==='users') v.innerHTML=usersView();
  else if(S.view==='useredit') v.innerHTML=userEdit();
  else if(S.view==='password') v.innerHTML=passwordView();
  else if(S.view==='overtime') v.innerHTML=overtimeView();
  else if(S.view==='sched') v.innerHTML=schedView();
}
function centerSeg(){
  if(S.data.role!=='ALL') return '';
  return '<div class="seg" role="group" aria-label="Center">'+[['SF','Sioux Falls'],['all','SEE'],['BV','Brandon']].map(function(c){ return '<button type="button" data-center="'+c[0]+'" aria-pressed="'+(S.center===c[0])+'">'+c[1]+'</button>'; }).join('')+'</div>';
}
function plural(n,a,b){ return n+' '+(n===1?a:b); }
function home(){
  var f=feed(), needs=f.filter(function(x){ return x.needs; });
  var unread=function(k){ return f.filter(function(x){ return x.kind===k && (x.unread||x.needs); }).length; };
  var ptoN=needs.filter(function(x){ return x.kind==='pto'; }).length;
  var ivN=needs.filter(function(x){ return x.kind==='hiring'; }).length;
  var newApps=f.filter(function(x){ return x.kind==='hiring' && x.unread && x.id.indexOf('app:')===0; }).length;
  var openN=function(k){ return f.filter(function(x){ return x.kind===k && x.steps && !x.done; }).length; };
  var parts=[]; if(ptoN) parts.push(plural(ptoN,'PTO request','PTO requests')); if(ivN) parts.push(plural(ivN,'interview to confirm','interviews to confirm'));
  [['onboard','new hire to enter','new hires to enter'],['term','staff termination','staff terminations'],['enroll','enrollment to set up','enrollments to set up'],['termcare','care termination','care terminations'],['careplan','care plan','care plans'],['vacation','vacation to process','vacations to process']].forEach(function(k){ var n=openN(k[0]); if(n) parts.push(plural(n,k[1],k[2])); });
  var d=new Date().toLocaleDateString('en-US',{weekday:'long',month:'short',day:'numeric'});
  var n=f.filter(function(x){ return x.unread||x.needs; }).length;
  var h='<div class="top"><div><div class="eyebrow">'+esc(d)+'</div><h1>'+esc(S.data.role==='ALL'?'SEE Bridge':'Bridge · '+S.data.label)+'</h1></div>'+
    '<button type="button" class="round" data-go="inbox" aria-label="Inbox, '+n+' new">'+svg('bell')+(n?'<span class="badge">'+(n>99?'99+':n)+'</span>':'')+'</button></div>'+centerSeg();
  h+= needs.length ? '<button type="button" class="wait" data-go="needs"><span style="flex:1"><div class="k">Waiting on you</div><div class="b">'+plural(needs.length,'thing needs','things need')+' you</div><div class="s">'+esc(parts.join(' · '))+'</div></span>'+svg('chev','#fff')+'</button>'
    : '<div class="wait calm"><span><div class="k">Waiting on you</div><div class="b">Nothing right now</div></span></div>';
  var team=[
    ['pto', ptoN, ptoN? plural(ptoN,'request','requests')+(isOffice()?' to approve':' waiting') : 'Nothing waiting'],
    ['hiring', unread('hiring'), [newApps?newApps+' new':'', ivN?ivN+' to confirm':''].filter(Boolean).join(' · ')||'All caught up'],
    ['onboard', unread('onboard'), openN('onboard')? openN('onboard')+' to enter' : unread('onboard')? plural(unread('onboard'),'new form','new forms') : 'New hires'],
    ['term', unread('term'), openN('term')? openN('term')+' open' : unread('term')? unread('term')+' new' : 'Termination of employment']
  ];
  if(S.data.overtime) team.push(['overtime', unread('overtime'), otTileLabel()]);
  var fam=[
    ['enroll', unread('enroll'), openN('enroll')? openN('enroll')+' to set up' : unread('enroll')? plural(unread('enroll'),'new packet','new packets') : 'All caught up'],
    ['careplan', unread('careplan'), openN('careplan')? openN('careplan')+' open' : unread('careplan')? plural(unread('careplan'),'new plan','new plans') : 'All caught up'],
    ['vacation', unread('vacation'), openN('vacation')? openN('vacation')+' to process' : unread('vacation')? plural(unread('vacation'),'new request','new requests') : 'All caught up'],
    ['termcare', unread('termcare'), openN('termcare')? openN('termcare')+' open' : unread('termcare')? unread('termcare')+' new' : 'Termination of care']
  ];
  var grid=function(tiles){ return '<div class="grid">'+tiles.map(function(t){ return '<button type="button" class="tile" data-tile="'+t[0]+'"><span class="row">'+ico(t[0])+(t[1]?'<span class="cnt">'+t[1]+'</span>':'')+'</span><span><div class="n">'+KIND[t[0]].name+'</div><div class="l">'+esc(t[2])+'</div></span></button>'; }).join('')+'</div>'; };
  team=team.filter(function(t){ return can(t[0]) && (t[0]!=='overtime' || S.data.overtime); }); fam=fam.filter(function(t){ return can(t[0]) && !(t[0]==='vacation' && S.center==='BV'); });
  if(PUSH.ask) h+='<div class="ask"><span class="ico" style="background:var(--blue)">'+svg('bell','#fff')+'</span><div class="grow"><b>Alerts for this phone</b>One tap to turn on.</div><button type="button" class="pill go" data-push="on">Turn on</button><button type="button" class="link" data-push="later" aria-label="Not now">Not now</button></div>';
  var quick=(issuer()&&can('pto')?'<button type="button" data-go="ptoadmin">'+svg('plus','#0a5bd3')+'<span>Issue PTO</span></button>':'')+(can('hiring')?'<button type="button" data-go="hiring-jobs">'+svg('plus','#0a5bd3')+'<span>Post a job</span></button>':'');
  if(team.length) h+='<h2 class="sec">Team members</h2>'+grid(team);
  if(quick) h+='<div class="quick">'+quick+'</div>';
  if(fam.length) h+='<h2 class="sec">Families</h2>'+grid(fam);
  if(S.data.owner) h+='<h2 class="sec">Preview</h2><div class="quick"><button type="button" data-go="sched">'+svg('pto','#0a5bd3')+'<span>Schedule<div class="help" style="margin:0;font-size:13px">Only you can see this while it’s being built</div></span></button></div>';
  return h;
}
// ---------- overtime (nightly report from the Overtime Alert task) ----------
function otPeople(c){ var o=S.data.overtime, s=o&&o.centers&&o.centers[c]; return s&&s.people||[]; }
function otGoing(p){ return (p.projected||0)>40 || (p.worked||0)>40; }
function otCenters(){ var o=S.data.overtime||{}, cs=Object.keys(o.centers||{}); if(S.data.role==='ALL' && S.center!=='all') cs=cs.filter(function(c){ return c===S.center; }); return ['SF','BV'].filter(function(c){ return cs.indexOf(c)>=0; }); }
function otTileLabel(){
  var o=S.data.overtime; if(!o || o.none) return 'Nightly report';
  var n=0; otCenters().forEach(function(c){ n+=otPeople(c).filter(otGoing).length; });
  return n ? n+' going over 40' : 'No overtime projected';
}
function h2(n){ return n==null ? '–' : Number(n).toFixed(2); }
function money(n){ return n==null ? '' : '$'+Number(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function otWeek(o){
  var f=function(d){ return d ? new Date(d+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'}) : ''; };
  var w=o.weekStart ? (o.preview?'Next week, ':'Week of ')+f(o.weekStart)+(o.weekEnd?' – '+f(o.weekEnd):'') : '';
  var r=o.runAt ? new Date(o.runAt) : null;
  return [w, r ? 'updated '+r.toLocaleDateString('en-US',{weekday:'short'})+' '+r.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'}) : ''].filter(Boolean).join(' · ');
}
function hrs1(n){ return n==null ? '' : String(parseFloat(Number(n).toFixed(2))); }
// Overtime as hours:minutes: 8.65 → "+ 8:39", 0.29 → "+ 0:17". Empty when not over.
function otHM(over){ var m=Math.round((Number(over)||0)*60); if(m<=0) return ''; return '+ '+Math.floor(m/60)+':'+String(m%60).padStart(2,'0'); }
// Center managers: their center only, no dollars. Hours per day (bold = clocked, italic = still scheduled), then Projected and Over.
function overtimeMgrView(o){
  var h='<button type="button" class="back" data-go="home">'+svg('back')+'Home</button><div class="top"><div><h1>Overtime</h1>'+(o.runAt?'<div class="help" style="margin:2px 0 0">'+esc(otWeek(o))+'</div>':'')+'</div></div>';
  if(o.none || !o.runAt) return h+'<div class="empty">No report yet. The overtime report runs at 9 PM, Sunday through Thursday, and shows up here.</div>';
  if(Date.now()-Date.parse(o.runAt)>4*864e5) h+='<div class="ot-warn">This is the last report, from '+esc(new Date(o.runAt).toLocaleDateString('en-US',{weekday:'long',month:'short',day:'numeric'}))+'. A newer one hasn’t come in.</div>';
  if(o.problems) h+='<div class="ot-warn"><b>Heads-up:</b> '+esc(o.problems)+'</div>';
  otCenters().forEach(function(c){
    var s=o.centers[c]||{}, ppl=s.people||[];
    if(s.ran===false){ h+='<div class="empty">This part of the report didn’t run tonight.</div>'; return; }
    h+='<div class="ot-total"><span class="k">Projected overtime</span><b>'+h2(s.otHours||0)+'<small>hrs</small></b></div>';
    if(!ppl.length){ h+='<div class="empty">No one on the schedule this week.</div>'; return; }
    var hasDays=ppl.some(function(p){ return Array.isArray(p.days) && p.days.length; });
    var dayOf=function(p,d){ return (p.days||[]).find(function(x){ return x && x.day===d; }); };
    var cols=['Mon','Tue','Wed','Thu','Fri'];
    if(!hasDays) cols=[]; // both centers are closed Saturday and Sunday
    var cell=function(p,d){ var x=dayOf(p,d);
      if(!x) return '<td class="d"><span class="no">–</span></td>';
      if(typeof x.actual==='number') return '<td class="d"><b>'+hrs1(x.actual)+'</b></td>';
      return '<td class="d">'+((x.scheduled||0)>0?'<i>'+hrs1(x.scheduled)+'</i>':'<span class="no">–</span>')+'</td>'; };
    h+='<div class="ot-tw"><table class="ot-t"><thead><tr><th>Name</th>'+cols.map(function(d){ return '<th>'+d+'</th>'; }).join('')+'<th>Projected</th><th>Over</th></tr></thead><tbody>'+
      ppl.map(function(p){ var over=(p.over||0)>0;
        return '<tr'+(over?' class="hot"':'')+'><td>'+esc(p.name)+'</td>'+cols.map(function(d){ return cell(p,d); }).join('')+
          '<td class="pj">'+hrs1(p.projected)+'</td><td>'+(over?'<span class="ot-over" style="margin:0">'+otHM(p.over)+'</span>':'<span class="no" style="color:var(--faint)">–</span>')+'</td></tr>'; }).join('')+
      '</tbody></table></div>';
    if(cols.length) h+='<div class="ot-key"><span><b>8.5</b> clocked</span><span><i>8</i> still scheduled</span></div>';
  });
  return h;
}
// Projected hours as one number with the part over 40 in red: 49.92 → 4 + 9.92, 40.02 → 40 + .02.
function otSplit(p){
  var s=h2(p.projected), ov=Number(p.over)||Math.max(0,(Number(p.projected)||0)-40);
  if(!(ov>0)) return esc(s);
  var o=h2(ov); if(ov<1) o=o.replace(/^0/,'');
  if(s.length>o.length && s.slice(-o.length)===o) return esc(s.slice(0,-o.length))+'<span class="ot-red">'+esc(o)+'</span>';
  return esc(s)+'<span class="ot-over">+'+esc(h2(ov))+'</span>';
}
// Mon–Fri squares: bold = hours clocked, italic = still scheduled, outlined red = the day they pass 40.
function otDays(p){
  var by={}; (p.days||[]).forEach(function(x){ if(x && x.day) by[x.day]=x; });
  return '<div class="ot-days">'+['Mon','Tue','Wed','Thu','Fri'].map(function(d){
    var x=by[d], v;
    if(!x) v='<span class="no">–</span>';
    else if(typeof x.actual==='number') v=x.actual>0 ? '<b>'+hrs1(x.actual)+'</b>' : ((x.scheduled||0)>0 ? '<b>0</b>' : '<span class="no">–</span>');
    else v=(x.scheduled||0)>0 ? '<i>'+hrs1(x.scheduled)+'</i>' : '<span class="no">–</span>';
    return '<div class="ot-dy'+(p.crosses===d?' x':'')+'"><div class="k">'+d+'</div><div class="v">'+v+'</div></div>';
  }).join('')+'</div>';
}
function overtimeView(){
  var o=S.data.overtime||{}, office=isOffice(); // managers see this same screen: their center only, no dollars
  var h='<button type="button" class="back" data-go="home">'+svg('back')+'Home</button><div class="top"><div><h1>Overtime</h1>'+(o.runAt?'<div class="help" style="margin:2px 0 0">'+esc(otWeek(o))+'</div>':'')+'</div></div>'+centerSeg();
  if(o.none || !o.runAt) return h+'<div class="empty">No report yet. The overtime report runs at 9 PM, Sunday through Thursday, and shows up here.</div>';
  var age=Date.now()-Date.parse(o.runAt);
  if(age>4*864e5) h+='<div class="ot-warn">This is the last report, from '+esc(new Date(o.runAt).toLocaleDateString('en-US',{weekday:'long',month:'short',day:'numeric'}))+'. A newer one hasn’t come in.</div>';
  if(o.problems) h+='<div class="ot-warn"><b>Heads-up:</b> '+esc(o.problems)+'</div>';
  otCenters().forEach(function(c){
    var s=o.centers[c]||{}, ppl=s.people||[], going=ppl.filter(otGoing);
    var close=ppl.filter(function(p){ return !otGoing(p) && (p.projected||0)>=35; });
    var ahead=ppl.filter(function(p){ return (p.aheadBy||0)>1; });
    var under=ppl.filter(function(p){ return !otGoing(p) && (p.projected||0)<35; });
    var sum=[s.otHours!=null&&going.length ? h2(s.otHours)+' OT hrs' : '', office&&s.otCost!=null&&going.length ? money(s.otCost) : ''].filter(Boolean).join(' · ');
    h+='<div class="ot-head"><h2>'+(c==='SF'?'Sioux Falls':'Brandon')+'</h2><span>'+esc(sum)+'</span></div>';
    if(s.ran===false){ h+='<div class="card"><div class="ot-line">This part of the report didn’t run tonight.</div></div>'; return; }
    if(!going.length) h+='<div class="card"><div class="ot-clear"><span class="okb">'+svg('check','#fff')+'</span><span class="grow"><b>No overtime '+(o.preview?'scheduled':'projected')+'</b><div class="sm" style="font-size:13px;color:var(--sub)">Everyone stays at 40 hours or under.</div></span></div></div>';
    else h+='<div class="card">'+going.map(function(p,i){
      var dt=o.preview ? 'Scheduled '+h2(p.scheduled)+' hrs' : 'Worked '+h2(p.worked)+' · '+h2(p.scheduled)+' still scheduled';
      if((p.worked||0)>40) dt+=' · already over'; else if(p.crosses) dt+=' · passes 40 '+esc(p.crosses);
      var hasDays=Array.isArray(p.days) && p.days.length;
      var right='<b>'+otSplit(p)+'</b>';
      if(office) right+='<small>'+(p.cost!=null?esc(money(p.cost)):'rate not visible')+'</small>';
      if(hasDays) return '<div class="ot-row has-days"><span class="ot-rank">'+(i+1)+'</span><span class="grow"><div class="nm">'+esc(p.name)+'</div></span><span class="ot-num">'+right+'</span>'+otDays(p)+(otHM(p.over)?'<span class="ot-ovm">'+otHM(p.over)+'</span>':'')+((p.worked||0)>40?'<div class="dt">Already over 40</div>':'')+'</div>';
      return '<div class="ot-row"><span class="ot-rank">'+(i+1)+'</span><span class="grow"><div class="nm">'+esc(p.name)+'</div><div class="dt">'+dt+'</div></span><span class="ot-num">'+right+'</span></div>'; }).join('')+'</div>';
    if(close.length) h+='<div class="grp">Close (35–40)</div><div class="card"><div class="ot-line">'+close.map(function(p){ return '<b>'+esc(p.name)+'</b> '+h2(p.projected); }).join(' · ')+'</div></div>';
    if(ahead.length) h+='<div class="grp">Running ahead of schedule</div><div class="card"><div class="ot-line">'+ahead.map(function(p){ return '<b>'+esc(p.name)+'</b> +'+h2(p.aheadBy)+' hrs'; }).join(' · ')+'</div></div>';
    if(under.length) h+='<div class="grp">Under 35</div><div class="card"><div class="ot-line">'+under.map(function(p){ return '<b>'+esc(p.name)+'</b> '+h2(p.projected); }).join(' · ')+'</div></div>';
  });
  return h;
}
function shortDay(at){ return new Date(at).toLocaleDateString('en-US',{month:'short',day:'numeric'}); }
function isOpen(x){ return S.open[x.id]!==undefined ? S.open[x.id] : (S.view==='list' && !x.done); }
function checklistHtml(x){
  var defs=(S.data.checklists||{})[x.steps]||[], c=x.checks||{}, office=isOffice();
  var row=function(key,label,off){ var v=c[key], locked=off&&!office;
    return '<button type="button" class="ck'+(v?' on':'')+'" data-check="'+esc(key)+'" data-id="'+esc(x.id)+'" aria-pressed="'+(v?'true':'false')+'"'+(locked?' disabled':'')+'><span class="bx">'+(v?svg('check','#fff'):'')+'</span><span class="cl">'+esc(label)+(v?'<small>'+esc(v.by)+' · '+esc(shortDay(v.at))+'</small>':locked?'<small>Brent or Chelsea</small>':'')+'</span></button>'; };
  return '<div class="cks">'+defs.map(function(s){
    if(!s.subs) return row(s.k,s.t,s.office);
    var n=s.subs.filter(function(b){ return c[s.k+'.'+b.k]; }).length;
    return '<div class="ckg"><div class="ckh">'+esc(s.t)+'<span>'+n+' of '+s.subs.length+'</span></div>'+s.subs.map(function(b){ return row(s.k+'.'+b.k,b.t,s.office); }).join('')+'</div>';
  }).join('')+'</div>';
}
function itemHtml(x){
  if(x.steps) return itemHtmlSteps(x);
  var status = x.status ? '<span class="tag '+(x.status==='Approved'?'ok':'bad')+'">'+esc(x.status)+'</span>' : x.needs ? '<span class="tag need">Needs you</span>' : '';
  var acts='';
  if(x.pto) acts+='<button type="button" class="pill go" data-pto="approve" data-id="'+esc(x.pto)+'">Approve</button><button type="button" class="pill no" data-pto="deny" data-id="'+esc(x.pto)+'">Deny</button>';
  if(x.kind==='pto' && x.needs && !x.pto) acts+='<span class="sb">Waiting for the office to approve.</span>';
  if(x.link) acts+='<a class="pill" href="'+esc(x.link)+'" target="_blank" rel="noopener" data-read="'+esc(x.id)+'">'+esc(x.linkLabel||'Open')+'</a>';
  if(x.open==='overtime') acts+='<button type="button" class="pill" data-go="overtime" data-read="'+esc(x.id)+'">Open the report</button>';
  if(x.open==='hiring') acts+='<button type="button" class="pill" data-go="hiring" data-read="'+esc(x.id)+'">Open in Hiring</button>';
  if(x.problem) acts+='<span class="tag bad">Not saved to Dropbox. Check the email.</span>';
  return '<div class="item'+(x.unread?' new':'')+'" data-item="'+esc(x.id)+'">'+ico(x.kind,true)+
    '<div class="mid"><div class="t"><span class="tt">'+esc(x.title)+'</span><span class="tm">'+esc(when(x.at))+'</span></div>'+
    '<span class="sb">'+status+esc(x.sub)+'</span>'+(x.note?'<span class="nt">“'+esc(x.note)+'”</span>':'')+
    (acts?'<div class="acts">'+acts+'</div>':'')+'</div>'+(x.unread?'<span class="dot" aria-label="New"></span>':'')+'</div>';
}
function itemHtmlSteps(x){
  var open=isOpen(x);
  var status = x.done ? '<span class="tag ok">Done</span>' : '<span class="tag need">'+esc(x.progress)+'</span>';
  var acts='<button type="button" class="pill'+(x.done?'':' go')+'" data-ckopen="'+esc(x.id)+'" aria-expanded="'+open+'">'+(open?'Hide checklist':'Checklist')+'</button>';
  if(x.link) acts+='<a class="pill" href="'+esc(x.link)+'" target="_blank" rel="noopener" data-read="'+esc(x.id)+'">'+esc(x.linkLabel||'Open')+'</a>';
  if(x.problem) acts+='<span class="tag bad">Not saved to Dropbox. Check the email.</span>';
  return '<div class="item'+(x.unread?' new':'')+'" data-item="'+esc(x.id)+'">'+ico(x.kind,true)+
    '<div class="mid"><div class="t"><span class="tt">'+esc(x.title)+'</span><span class="tm">'+esc(when(x.at))+'</span></div>'+
    '<span class="sb">'+status+esc(x.sub)+'</span>'+(x.note?'<span class="nt">“'+esc(x.note)+'”</span>':'')+
    '<div class="acts">'+acts+'</div>'+(open?checklistHtml(x):'')+'</div>'+(x.unread?'<span class="dot" aria-label="New"></span>':'')+'</div>';
}
function listHtml(items, emptyText){
  if(!items.length) return '<div class="empty">'+esc(emptyText)+'</div>';
  var out='', g='', buf='';
  items.forEach(function(x){ var k=group(x.at); if(k!==g){ if(buf) out+='<div class="card">'+buf+'</div>'; buf=''; g=k; out+='<div class="grp">'+k+'</div>'; } buf+=itemHtml(x); });
  return out+'<div class="card">'+buf+'</div>';
}
function inbox(){

// On Board has no "SEE" tab: every new hire belongs to one center.
function obCenter(){ return S.center!=='all' ? S.center : (S.obCenter||'SF'); }
function listView(kind){
  var twoTab = kind==='onboard' && S.data.role==='ALL';
  var f = twoTab ? (S.data.feed||[]).filter(function(x){ return x.kind===kind && (!x.center || x.center===obCenter()); }) : feed().filter(function(x){ return x.kind===kind; });
  var extra = kind==='pto' && ptoAdminOK() ? '<div class="quick"><button type="button" data-go="ptoadmin">'+svg('chev','#0a5bd3')+'<span>'+ptoAdminLabel()+'</span></button></div>'
    : kind==='onboard' ? '<div class="quick"><button type="button" data-go="onboardform">'+svg('plus','#0a5bd3')+'<span>Fill out an On Board form</span></button></div>' : '';
  var seg = twoTab ? '<div class="seg" role="group" aria-label="Center">'+[['SF','Sioux Falls'],['BV','Brandon']].map(function(c){ return '<button type="button" data-center="'+c[0]+'" data-ob="1" aria-pressed="'+(obCenter()===c[0])+'">'+c[1]+'</button>'; }).join('')+'</div>' : centerSeg();
  var head='<button type="button" class="back" data-go="home">'+svg('back')+'Home</button><div class="top"><h1>'+(KIND[kind].full||KIND[kind].name)+'</h1></div>'+seg+extra;
  if(!(S.data.checklists||{})[kind]) return head+listHtml(f, kind==='onboard'?'No On Board forms in the last year.':'Nothing from the last 45 days.');
  // Checklist areas: open ones up top; finished ones fold into Completed; after 30 days they move to the Archive.
  var open=[], done=[], arch=[], now=Date.now();
  f.forEach(function(x){ if(x.steps && !x.done) open.push(x); else (now-doneAt(x) <= 30*864e5 ? done : arch).push(x); });
  var h=head+listHtml(open, 'Nothing open right now. 🎉');
  var sk=kind+':done', ak=kind+':arch';
  if(kind==='onboard'){
    // Finished in the last 30 days: one compact row each (tap to expand). Older: folded into Completed.
    if(done.length) h+='<div class="grp">Recently finished</div><div class="card">'+done.map(function(x){ return S.mini[x.id] ? itemHtml(x)+'<button type="button" class="link minic" data-mini="'+esc(x.id)+'">Show less</button>' : miniRow(x); }).join('')+'</div>';
    if(arch.length) h+='<button type="button" class="sect" data-sect="'+ak+'" aria-expanded="'+!!S.sect[ak]+'"><span class="grow">Completed <b>'+arch.length+'</b><small>Finished more than 30 days ago</small></span>'+svg('chev')+'</button>'+
      (S.sect[ak]?'<input type="search" class="arq" id="ar-q" placeholder="Search completed" value="'+esc(S.arq||'')+'" aria-label="Search completed"><div id="ar-list">'+archList(arch)+'</div>':'');
    return h;
  }
  if(done.length) h+='<button type="button" class="sect" data-sect="'+sk+'" aria-expanded="'+!!S.sect[sk]+'"><span class="grow">Completed <b>'+done.length+'</b><small>Finished in the last 30 days</small></span>'+svg('chev')+'</button>'+(S.sect[sk]?listHtml(done,''):'');
  if(arch.length) h+='<button type="button" class="sect" data-sect="'+ak+'" aria-expanded="'+!!S.sect[ak]+'"><span class="grow">Archive <b>'+arch.length+'</b><small>Finished more than 30 days ago</small></span>'+svg('chev')+'</button>'+
    (S.sect[ak]?'<input type="search" class="arq" id="ar-q" placeholder="Search the archive" value="'+esc(S.arq||'')+'" aria-label="Search the archive"><div id="ar-list">'+archList(arch)+'</div>':'');
  return h;
}
function miniRow(x){
  var name=String(x.title||'').replace(/^On board · /,''), d=(String(x.sub||'').match(/Starts [^·]+/)||[''])[0].trim();
  return '<button type="button" class="mini" data-mini="'+esc(x.id)+'" aria-expanded="false"><span class="okb" aria-label="Done">'+svg('check','#fff')+'</span><span class="mn">'+esc(name)+'</span><span class="md">'+esc(d)+'</span>'+svg('chev')+'</button>';
}
function doneAt(x){ var m=0; Object.keys(x.checks||{}).forEach(function(k){ var a=Date.parse(x.checks[k].at); if(a>m) m=a; }); return m || Date.parse(x.at); }
function archList(arch){ var q=String(S.arq||'').trim().toLowerCase(); var l=q?arch.filter(function(x){ return (x.title+' '+x.sub).toLowerCase().indexOf(q)>=0; }):arch; return listHtml(l, q?'No matches.':''); }
function sw(id, on, label){ return '<span class="sw"><input type="checkbox" id="'+id+'"'+(on?' checked':'')+' aria-label="'+esc(label)+'"><span></span></span>'; }

  h+='<p class="help">These switches are just for your phone alerts. The emails keep coming the same way they do now.</p>';

// ---------- phone alerts ----------
function pushSupported(){ return 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window; }
function standalone(){ return (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone===true; }
function iOS(){ return /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1); }
var PUSH={ on:false, checked:false, ask:false };
function later(){ try{ return localStorage.getItem('seeBridgeLater')==='1'; }catch(e){ return false; } }
function pushStateHtml(){
  if(!S.data.pushReady) return '<div style="font-weight:600">Not set up yet</div><div class="sm">The office needs to finish the one-time setup (HUB_PUSH_KEY). The inbox works in the meantime.</div>';
  if(iOS() && !standalone()) return '<div style="font-weight:600">Add SEE Bridge to your Home Screen first</div><div class="sm">In Safari, tap the Share button, then <b>Add to Home Screen</b>. Open SEE Bridge from the new icon and come back here to turn on alerts.</div>';
  if(!pushSupported()) return '<div style="font-weight:600">This browser can’t show alerts</div><div class="sm">Try Safari on iPhone (added to the Home Screen), or Chrome or Edge on a computer.</div>';
  if(window.Notification && Notification.permission==='denied') return '<div style="font-weight:600">Alerts are blocked</div><div class="sm">Turn on notifications for SEE Bridge in your phone’s Settings, then come back.</div>';
  if(!PUSH.checked) return '<span class="spin"></span>';
  if(PUSH.on) return '<div style="font-weight:600">Alerts are on</div><div class="sm">'+(S.data.devices>1?'On '+S.data.devices+' devices.':'On this device.')+'</div><div class="acts" style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap"><button type="button" class="pill go" data-push="test">Send a test</button><button type="button" class="pill" data-push="off">Turn off</button></div>';
  return '<div style="font-weight:600">Alerts are off</div><div class="sm">Get a buzz when something comes in.</div><button type="button" class="btn" style="margin-top:10px" data-push="on">Turn on alerts</button>';

    post({action:'check', id:cid, box:box, on:on}).then(function(r){ if(apply(r)){ render(); var nx=(S.data.feed||[]).find(function(y){ return y.id===cid; }); if(nx && nx.done && on) toast('All done: '+nx.title); } else refresh(true); });
    return;
  }
  if(t.hasAttribute('data-pto')){
    var dec=t.getAttribute('data-pto'), id=t.getAttribute('data-id');
    if(dec==='deny' && !confirm('Deny this PTO request? The team member will get an email.')) return;
    t.disabled=true; t.textContent=dec==='deny'?'Denying…':'Approving…';
    post({action:'pto', id:id, decision:dec}).then(function(r){ if(apply(r)){ render(); toast(r.message||'Done.'); } else { t.disabled=false; t.textContent=dec==='deny'?'Deny':'Approve'; } });
    return;
  }
  if(t.hasAttribute('data-push')){ var a=t.getAttribute('data-push'); if(a==='on') pushOn(); else if(a==='later'){ try{ localStorage.setItem('seeBridgeLater','1'); }catch(e){} PUSH.ask=false; render(); } else if(a==='off'){ try{ localStorage.setItem('seeBridgeLater','1'); }catch(e){} pushOff(); } else { t.disabled=true; post({action:'test', token:me.token}).then(function(r){ t.disabled=false; toast(r.ok?r.message:(r.error||'That didn’t work.')); }); } return; }
  if(t.hasAttribute('data-logout')){ if(!confirm('Log out of SEE Bridge on this device?')) return; var who=me&&(me.user||''), wasPass=me&&!me.session; pushOff(true).then(function(){ return me&&me.session?post({action:'signout'}):null; }).then(function(){ try{ localStorage.removeItem('seeHiringPass'); localStorage.removeItem('seeBridgeSession'); }catch(e){} save(null); S.data=null; S.users=null; showLogin('', who, wasPass?'pass':''); }); return; }
  if(t.hasAttribute('data-mini')){ var mid=t.getAttribute('data-mini'); S.mini[mid]=!S.mini[mid]; render(); return; }
  if(t.hasAttribute('data-sect')){ var sk2=t.getAttribute('data-sect'); S.sect[sk2]=!S.sect[sk2]; render(); return; }
  if(t.hasAttribute('data-auth')){ var am=t.getAttribute('data-auth'), wn=($('lu-name')||$('fg-name')||{}).value||''; if(am==='forgot') showForgot(wn); else if(am==='pass') showLogin('', '', 'pass'); else showLogin('', wn); return; }
  if(t.hasAttribute('data-uedit')){
    var uid=t.getAttribute('data-uedit');
    if(uid==='new') S.uedit={ id:'', name:'', username:'', email:'', role:'manager', center:'SF', areas:{}, active:true };
    else { var src=(S.users.users||[]).find(function(x){ return x.id===uid; }); if(!src) return; S.uedit=JSON.parse(JSON.stringify(src)); }
    setView('useredit'); return;
  }
  if(t.hasAttribute('data-urole')){ grabU(); S.uedit.role=t.getAttribute('data-urole'); render(); return; }
  if(t.hasAttribute('data-ucenter')){ grabU(); S.uedit.center=t.getAttribute('data-ucenter'); render(); return; }
  if(t.hasAttribute('data-usave')){
    grabU(); var su=S.uedit; t.disabled=true; t.textContent='Saving…';
    post({action:'usersave', user:{ id:su.id, name:su.name, username:su.username, email:su.email, role:su.role, center:su.center, areas:su.areas, active:su.active!==false }}).then(function(r){
      if(r.locked){ apply(r); return; }
      if(!r.ok){ t.disabled=false; t.textContent=su.id?'Save':'Add & send invite'; $('u-err').textContent=r.error||'That didn’t work.'; return; }
      S.users=r; toast(r.message||'Saved.'); setView('users');
      if(su.username && S.data.username===String(su.username).toLowerCase()) refresh(true);
    });
    return;
  }
  if(t.hasAttribute('data-ulink')){ t.disabled=true; post({action:'userlink', id:S.uedit.id}).then(function(r){ t.disabled=false; if(r.ok){ S.users=r; toast(r.message); } else $('u-err').textContent=r.error||'That didn’t work.'; }); return; }
  if(t.hasAttribute('data-uremove')){ if(!confirm('Remove '+S.uedit.name+'? They won’t be able to sign in. You can add them again later.')) return; post({action:'userremove', id:S.uedit.id}).then(function(r){ if(r.ok){ S.users=r; toast(r.message); setView('users'); } else $('u-err').textContent=r.error||'That didn’t work.'; }); return; }
  if(t.classList.contains('item')){ var iid=t.getAttribute('data-item'); var x=(S.data.feed||[]).find(function(y){ return y.id===iid; }); if(x && x.unread && (!x.needs || x.steps)){ markRead([iid]); t.classList.remove('new'); var dot=t.querySelector('.dot'); if(dot) dot.remove(); } }
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.id==='pc-on'){ var want=t.checked; if(!want && !confirm('Turn off the shared passcodes? Everyone will need their own username to sign in.')){ t.checked=true; return; } post({action:'passcodes', on:want}).then(function(r){ if(r.ok){ S.users=r; toast(r.message); } else { toast(r.error||'That didn’t work.'); t.checked=!want; } }); return; }
  if(t.id && t.id.indexOf('ua-')===0 && S.uedit){ S.uedit.areas=S.uedit.areas||{}; S.uedit.areas[t.id.slice(3)]=t.checked; return; }
  if(t.id==='u-active' && S.uedit){ S.uedit.active=t.checked; return; }
  if(!t.id || t.id.indexOf('pf-')!==0) return;
  var k=t.id.slice(3), o={}; o[k]=t.checked; S.prefs[k]=t.checked;
  post({action:'prefs', prefs:o}).then(function(r){ if(r.ok) S.prefs=r.prefs; else { toast(r.error||'Couldn’t save that.'); t.checked=!t.checked; } });
});
document.addEventListener('input',function(e){ if(e.target.id!=='ar-q') return; S.arq=e.target.value; var f=(S.list==='onboard'&&S.data.role==='ALL')?(S.data.feed||[]).filter(function(x){ return x.kind==='onboard' && (!x.center || x.center===obCenter()); }):feed().filter(function(x){ return x.kind===S.list; }), now=Date.now(); var arch=f.filter(function(x){ return !(x.steps && !x.done) && now-doneAt(x)>30*864e5; }); var box=$('ar-list'); if(box) box.innerHTML=archList(arch); });
document.addEventListener('visibilitychange',function(){ if(!document.hidden && me && S.data) refresh(true); });
setInterval(function(){ if(!document.hidden && me && S.data && S.view!=='settings') refresh(true); }, 60000);
if(navigator.serviceWorker) navigator.serviceWorker.addEventListener('message',function(e){ if(e.data && e.data.go==='inbox' && S.data){ refresh(true); setView('inbox'); } });

// ---------- Schedule (replacing When I Work). Owner-only preview while it's being built. ----------
var SC_DAYS=[['mon','Mon'],['tue','Tue'],['wed','Wed'],['thu','Thu'],['fri','Fri']];
var SC_ALL_DAYS=['mon','tue','wed','thu','fri','sat','sun'];
function scMonday(d){ d=new Date(d.getFullYear(),d.getMonth(),d.getDate()); var k=(d.getDay()+6)%7; d.setDate(d.getDate()-k); return d; }
function scIso(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function scDate(iso,add){ var p=iso.split('-'); var d=new Date(+p[0],+p[1]-1,+p[2]); if(add) d.setDate(d.getDate()+add); return d; }
function scMins(t){ return +t.slice(0,2)*60 + +t.slice(3); }
function scT(t){ var h=+t.slice(0,2), m=t.slice(3), a=h<12?'a':'p'; h=h%12||12; return h+(m==='00'?'':':'+m)+a; }
function scHM(m){ return Math.floor(m/60)+':'+String(m%60).padStart(2,'0'); }
function scPay(p,mins){ if(p.payType==='salaried'||typeof p.rate!=='number') return null; var reg=Math.min(mins,2400), ot=Math.max(0,mins-2400); return (reg*p.rate + ot*p.rate*1.5)/60; }
function scMoney(n){ return '$'+n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function scBlocksMins(list){ return (list||[]).reduce(function(s,b){ return s+Math.max(0,scMins(b.e)-scMins(b.s)); },0); }
function scWeekMins(days){ return SC_ALL_DAYS.reduce(function(s,k){ return s+scBlocksMins((days||{})[k]); },0); }
function scPos(k){ return ((S.sc.data&&S.sc.data.positions)||[]).find(function(p){ return p.key===k; }) || { key:k, name:k, color:'#8e8e93', kind:'room' }; }
function scRow(id){ return ((S.sc.data&&S.sc.data.rows)||[]).find(function(r){ return r.staffId===id; }) || { staffId:id, days:{}, published:null, rev:0 }; }
function scInit(){ if(!S.sc){ var nw=scMonday(new Date()); nw.setDate(nw.getDate()+7); S.sc={ center:'SF', week:scIso(nw), data:null, busy:false, edit:null }; } }
function scPost(o){
  o.form='sched'; if(me&&me.session) o.session=me.session;
  return fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(o)})
    .then(function(r){ return r.json(); })
    .catch(function(){ return { ok:false, error:'Can’t reach SEE right now. Check your connection and try again.' }; });
}
function scLoad(){
  scInit(); S.sc.busy=true; S.sc.data=null; render();
  return scPost({ action:'sched_load', center:S.sc.center, week:S.sc.week }).then(scApply);
}
function scApply(r){
  S.sc.busy=false;
  if(r && r.locked){ toast(r.error); return; }
  if(!r || (!r.ok && !r.rows)){ toast((r&&r.error)||'Something went wrong.'); if(S.view==='sched') render(); return; }
  if(!r.ok) toast(r.error);
  if(r.message) toast(r.message);
  S.sc.data=r; if(S.view==='sched') render();
}
function scWeekLabel(){ var a=scDate(S.sc.week), b=scDate(S.sc.week,4), f=function(d){ return d.toLocaleDateString('en-US',{month:'short',day:'numeric'}); }; return f(a)+' – '+f(b); }

function schedView(){
  scInit(); var d=S.sc.data;
  var h='<button type="button" class="back" data-go="home">'+svg('back')+'Home</button>'+
    '<div class="top"><div><div class="eyebrow">Preview · only you can see this</div><h1>Schedule</h1><div class="help" style="margin:2px 0 0">Sioux Falls · Week of '+esc(scWeekLabel())+'</div></div></div>'+
    '<div class="sc-bar"><button type="button" class="round" data-sc="prev" aria-label="Previous week">'+svg('back')+'</button><button type="button" class="pill" data-sc="today">This week</button><button type="button" class="round" data-sc="next" aria-label="Next week">'+svg('chev')+'</button>'+
    '<span style="flex:1"></span><button type="button" class="pill" data-sc="copy">Copy last week</button>'+
    (d? '<button type="button" class="pill go" data-sc="publish"'+(d.unpublished?'':' disabled')+'>'+(d.unpublished?'Publish ('+d.unpublished+')':'Published')+'</button>':'')+'</div>';
  if(!d) return h+'<div class="empty"><span class="spin"></span> Loading…</div>';
  if(d.unpublished) h+='<div class="note">Draft: '+plural(d.unpublished,'person’s week has','people’s weeks have')+' changes that aren’t published yet (dashed outline).</div>';
  var closed={}; (d.closed||[]).forEach(function(c){ closed[c.date]=c.title||'Closed'; });
  var cols=SC_DAYS.map(function(dd,i){ return { key:dd[0], label:dd[1], date:scIso(scDate(S.sc.week,i)) }; });
  var dayTot={}; cols.forEach(function(c){ dayTot[c.key]=0; });
  var payTot=0, people=[{ id:'open', name:'Open shifts', open:true }].concat(d.staff||[]);
  var rowsH=people.map(function(p){
    var r=scRow(p.id), days=r.days||{}, pub=r.published||{};
    var here=scWeekMins(days), oth=d.other&&d.other[p.id]?d.other[p.id].minutes:0, tot=here+oth;
    var cells=cols.map(function(c){
      var list=days[c.key]||[], changed=JSON.stringify(list)!==JSON.stringify(pub[c.key]||[]) && !(list.length===0 && !(pub[c.key]||[]).length);
      if(!p.open) dayTot[c.key]+=scBlocksMins(list);
      var od=d.other&&d.other[p.id]&&(d.other[p.id].days||{})[c.key]||[];
      var chips=list.map(function(b){ var ps=scPos(b.p); return '<span class="sc-chip" style="background:'+ps.color+'1f;border-left:3px solid '+ps.color+'"><b>'+scT(b.s)+'–'+scT(b.e)+'</b><span>'+esc(ps.name)+'</span></span>'; }).join('');
      if(od.length) chips+='<span class="sc-chip sc-other"><b>'+scT(od[0].s)+'–'+scT(od[od.length-1].e)+'</b><span>at Brandon</span></span>';
      if(closed[c.date]) return '<td class="sc-cell sc-closed"><span class="sc-cl">'+(p.open?esc(closed[c.date]):'')+'</span></td>';
      return '<td class="sc-cell'+(changed?' sc-chg':'')+'"><button type="button" class="sc-hit" data-sc="edit" data-id="'+esc(p.id)+'" data-day="'+c.key+'" aria-label="'+esc(p.name+', '+c.label)+'">'+(chips||'<span class="sc-plus">+</span>')+'</button></td>';
    }).join('');
    var sub;
    if(p.open) sub='<small>Anyone can pick up</small>';
    else { var pay=scPay(p,tot); if(pay!=null) payTot+=pay;
      sub='<span class="sc-hp"><b>'+scHM(tot)+' hrs</b>'+(p.payType!=='salaried'&&tot>2400?'<em>+ '+scHM(tot-2400)+' OT</em>':'')+'</span>'+
        '<small>'+(p.payType==='salaried'?'Salaried':pay!=null?scMoney(pay):'')+(oth?((p.payType==='salaried'||pay!=null?' · ':'')+'incl. '+scHM(oth)+' at Brandon'):'')+'</small>'; }
    return '<tr'+(p.open?' class="sc-open"':'')+'><th scope="row"><span class="sc-nm">'+esc(p.name)+'</span>'+sub+'</th>'+cells+'</tr>';
  }).join('');
  var head='<tr><th></th>'+cols.map(function(c){ var dt=scDate(c.date); return '<th><button type="button" class="sc-day" data-sc="day" data-date="'+c.date+'">'+c.label+' '+dt.getDate()+(closed[c.date]?'<small>'+esc(closed[c.date])+'</small>':'')+'</button></th>'; }).join('')+'</tr>';
  var weekTot=cols.reduce(function(s,c){ return s+dayTot[c.key]; },0);
  var foot='<tr class="sc-foot"><th>'+scHM(weekTot)+' hrs'+(payTot?'<small>'+scMoney(payTot)+' est.</small>':'')+'</th>'+cols.map(function(c){ return '<td>'+(dayTot[c.key]?scHM(dayTot[c.key])+' hrs':'')+'</td>'; }).join('')+'</tr>';
  h+='<div class="sc-wrap"><table class="sc-t"><thead>'+head+'</thead><tbody>'+rowsH+'</tbody><tfoot>'+foot+'</tfoot></table></div>';
  h+='<div class="sc-key">'+(d.positions||[]).filter(function(p){ return p.centers.indexOf(S.sc.center)>=0; }).map(function(p){ return '<span><i style="background:'+p.color+'"></i>'+esc(p.name)+'</span>'; }).join('')+'</div>';
  h+='<p class="help">Tap a day to add or change shifts. Tap a day’s name to mark the center closed or open it again. Hours under each name include time at Brandon; overtime shows in red past 40. Pay is an estimate (time and a half past 40).</p>';
  if(S.sc.edit) h+=scEditor();
  return h;
}

function scEditor(){
  var e=S.sc.edit, d=S.sc.data, p=e.id==='open'?{ id:'open', name:'Open shift', positions:[] }:(d.staff||[]).find(function(x){ return x.id===e.id; })||{ name:'', positions:[] };
  var dayName=(SC_DAYS.find(function(x){ return x[0]===e.day; })||['',''])[1], date=scDate(S.sc.week,SC_DAYS.findIndex(function(x){ return x[0]===e.day; }));
  var opts=function(sel){ var mine=(d.positions||[]).filter(function(ps){ return ps.centers.indexOf(S.sc.center)>=0; });
    var ok=mine.filter(function(ps){ return e.id==='open' || p.positions.indexOf(ps.key)>=0; }), rest=mine.filter(function(ps){ return ok.indexOf(ps)<0; });
    var o=function(ps){ return '<option value="'+ps.key+'"'+(ps.key===sel?' selected':'')+'>'+esc(ps.name)+'</option>'; };
    return ok.map(o).join('')+(rest.length?'<optgroup label="Not usually theirs">'+rest.map(o).join('')+'</optgroup>':''); };
  var rows=e.blocks.map(function(b,i){ return '<div class="sc-blk"><input type="time" step="300" aria-label="Start" data-sb="s" data-i="'+i+'" value="'+b.s+'"><span>to</span><input type="time" step="300" aria-label="End" data-sb="e" data-i="'+i+'" value="'+b.e+'"><select aria-label="Room or duty" data-sb="p" data-i="'+i+'">'+opts(b.p)+'</select><button type="button" class="sc-x" data-sc="del" data-i="'+i+'" aria-label="Remove this block">×</button></div>'; }).join('');
  var mins=scBlocksMins(e.blocks.filter(function(b){ return b.s&&b.e&&b.e>b.s; }));
  return '<div class="sc-sheet" role="dialog" aria-modal="true" aria-label="Edit shifts"><div class="sc-card">'+
    '<div class="sc-ch"><div><b>'+esc(p.name)+'</b><div class="sm">'+dayName+' '+date.toLocaleDateString('en-US',{month:'short',day:'numeric'})+(mins?' · '+scHM(mins)+' hrs':'')+'</div></div><button type="button" class="link" data-sc="close">Cancel</button></div>'+
    (rows||'<div class="help" style="margin:6px 0 10px">No shifts this day.</div>')+
    '<div class="sc-acts"><button type="button" class="pill" data-sc="add">+ Add a block</button>'+(e.blocks.length?'<button type="button" class="pill" data-sc="clear">Clear day</button>':'')+'</div>'+
    '<label class="sc-rep"><input type="checkbox" id="sc-rep"'+(e.rep?' checked':'')+'> Use for every weekday this week</label>'+
    '<div class="err" id="sc-err" role="alert"></div><button type="button" class="btn" data-sc="save" style="width:100%">Save</button></div></div>';
}
function scGrab(){
  var e=S.sc.edit; if(!e) return;
  Array.prototype.forEach.call(document.querySelectorAll('[data-sb]'),function(el){ var b=e.blocks[+el.getAttribute('data-i')]; if(b) b[el.getAttribute('data-sb')]=el.value; });
  var rep=$('sc-rep'); if(rep) e.rep=rep.checked;
}
function schedClick(t){
  var a=t.getAttribute('data-sc'); scInit();
  if(a==='prev'||a==='next'){ S.sc.week=scIso(scDate(S.sc.week,a==='prev'?-7:7)); S.sc.edit=null; scLoad(); return; }
  if(a==='today'){ S.sc.week=scIso(scMonday(new Date())); S.sc.edit=null; scLoad(); return; }
  if(a==='copy'){ if(!confirm('Copy last week’s shifts into this week? People who already have shifts this week are left alone.')) return; t.disabled=true; scPost({ action:'sched_copy', center:S.sc.center, week:S.sc.week }).then(scApply); return; }
  if(a==='publish'){ if(!confirm('Publish this week? (Staff alerts aren’t turned on yet, so nobody is notified.)')) return; t.disabled=true; scPost({ action:'sched_publish', center:S.sc.center, week:S.sc.week }).then(scApply); return; }
  if(a==='day'){ var dt=t.getAttribute('data-date'), isC=(S.sc.data.closed||[]).some(function(c){ return c.date===dt; });
    if(isC){ if(!confirm('Open the center again on this day?')) return; scPost({ action:'sched_closed', center:S.sc.center, week:S.sc.week, date:dt, on:false }).then(scApply); }
    else { var hasShifts=(S.sc.data.rows||[]).some(function(r){ var k=SC_DAYS[Math.round((scDate(dt)-scDate(S.sc.week))/864e5)]; return k && ((r.days||{})[k[0]]||[]).length; }); var why=prompt('Mark the center closed this day?'+(hasShifts?' Anyone scheduled that day will be taken off it.':'')+' Type the reason (for example Thanksgiving):','Closed'); if(why===null) return; scPost({ action:'sched_closed', center:S.sc.center, week:S.sc.week, date:dt, title:why }).then(scApply); }
    return; }
  if(a==='edit'){ var id=t.getAttribute('data-id'), day=t.getAttribute('data-day'), r=scRow(id);
    var st=(S.sc.data.staff||[]).find(function(x){ return x.id===id; }), firstRoom=st&&st.positions.find(function(k){ return scPos(k).kind==='room'; });
    var blocks=JSON.parse(JSON.stringify((r.days||{})[day]||[]));
    if(!blocks.length) blocks=[{ s:'07:00', e:'17:00', p:firstRoom||(st&&st.positions[0])||'infant' }];
    S.sc.edit={ id:id, day:day, blocks:blocks, rev:r.rev||0 }; render(); return; }
  if(a==='close'){ S.sc.edit=null; render(); return; }
  if(a==='add'){ scGrab(); var e=S.sc.edit, last=e.blocks[e.blocks.length-1]; e.blocks.push({ s:last?last.e:'07:00', e:last?(last.e<'17:00'?'17:00':'18:00'):'17:00', p:last?last.p:'infant' }); render(); return; }
  if(a==='del'){ scGrab(); S.sc.edit.blocks.splice(+t.getAttribute('data-i'),1); render(); return; }
  if(a==='clear'){ scGrab(); S.sc.edit.blocks=[]; render(); return; }
  if(a==='save'){
    scGrab(); var ed=S.sc.edit, bad=ed.blocks.find(function(b){ return !b.s||!b.e||b.e<=b.s; });
    if(bad){ $('sc-err').textContent='Each block needs an end time after its start time.'; return; }
    var row=scRow(ed.id), days=JSON.parse(JSON.stringify(row.days||{})), clean=ed.blocks.map(function(b){ return { s:b.s, e:b.e, p:b.p }; }).sort(function(x,y){ return x.s<y.s?-1:1; });
    if(ed.rep) SC_DAYS.forEach(function(dd){ days[dd[0]]=JSON.parse(JSON.stringify(clean)); }); else days[ed.day]=clean;
    t.disabled=true; t.textContent='Saving…';
    scPost({ action:'sched_save', center:S.sc.center, week:S.sc.week, staffId:ed.id, rev:row.rev||0, days:days }).then(function(r){ if(r&&r.ok) S.sc.edit=null; else if(r&&r.conflict) S.sc.edit=null; scApply(r); if(r&&!r.ok&&!r.conflict&&$('sc-err')){ $('sc-err').textContent=r.error||'That didn’t save.'; t.disabled=false; t.textContent='Save'; } });
    return; }
}

// ---------- go ----------
if(/^#setpw=/.test(location.hash)){ save(null); showSetPw(location.hash.slice(7)); }
else if(me && (me.session || (me.pass && me.name))){
  $('nav').classList.remove('hidden'); render();
  post({action:'login'}).then(function(r){ if(r.ok) start(r); else if(r.locked) showLogin(r.error); else { $('view').innerHTML='<div class="empty">'+esc(r.error||'Couldn’t load.')+'<br><br><button type="button" class="btn" onclick="location.reload()">Try again</button></div>'; } });
} else showLogin();
})();
</script>
